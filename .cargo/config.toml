# Target a 2013-era instruction set rather than the 2003 x86-64 baseline.
#
# The render hot loops (resample tap accumulation, blur row accumulation) are
# written as contiguous scaled adds precisely so LLVM can vectorize them, but
# the default `x86-64` target permits only SSE2 — no AVX2, no FMA — so the
# vectorizer emits 4-wide float ops at best and never fuses the multiply-add.
#
# `x86-64-v3` (AVX2 + FMA + BMI) covers Intel Haswell and AMD Excavator
# onward. `native` would be faster still on this machine but produces binaries
# that crash on older CPUs, which is wrong for anything shipped.
#
# If Bloom ever needs to run on pre-2013 hardware, drop this to `x86-64-v2`
# (SSE4.2, ~2009) or remove it and take the baseline.
[build]
rustflags = ["-C", "target-cpu=x86-64-v3"]
